    async function api(path, body) {
      const res = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
      return res.json();
    }

    async function apiGet(path) {
      const res = await fetch('/api/' + path);
      return res.json();
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      ['main', 'profile', 'admin'].forEach(function(t) { document.getElementById('tab-content-' + t).classList.add('hidden'); });
      document.getElementById('tab-content-' + tab).classList.remove('hidden');
      if (tab === 'admin') loadAdminList();
    }

    async function showRegistrationOrMain() {
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (!user) { document.body.innerHTML = '<div style="padding:40px;text-align:center;color:white;font-size:18px;">Открой через Telegram</div>'; return; }
      currentUser = user;

      const result = await api('get-santa', { telegram_id: user.id });

      if (result.error === 'Ты ещё не зарегистрирован') {
        const settings = await apiGet('get-settings');

        document.getElementById('screen-register').classList.remove('hidden');
        document.getElementById('screen-main').classList.add('hidden');

        if (!settings.is_open) {
          document.getElementById('reg-timer').textContent = '🔒 Регистрация закрыта';
          document.getElementById('reg-submit-btn').disabled = true;
          document.getElementById('reg-submit-btn').textContent = 'Регистрация закрыта';
          return;
        }

        if (user.first_name) document.getElementById('reg-first-name').value = user.first_name;
        if (user.last_name) document.getElementById('reg-last-name').value = user.last_name;
        if (user.username) document.getElementById('reg-nickname').value = '@' + user.username;

        startRegTimer(settings.seconds_left);
        return;
      }

      if (result.error) { showToast('Ошибка: ' + result.error); return; }

      myData = result.me;
      assignedData = result.assigned;
      isAdmin = myData.is_admin;

      document.getElementById('screen-register').classList.add('hidden');
      document.getElementById('screen-main').classList.remove('hidden');

      if (isAdmin) document.getElementById('tab-admin').classList.remove('hidden');

      renderMain();
      fillProfile();
      loadMainTimer();
    }

    async function loadMainTimer() {
      const settings = await apiGet('get-settings');
      const timerEl = document.getElementById('main-reg-timer');

      if (settings.is_open) {
        timerEl.style.display = 'block';
        startMainTimer(settings.seconds_left);
      } else {
        timerEl.style.display = 'block';
        timerEl.textContent = '🔒 Регистрация закрыта';
      }
    }

    function startMainTimer(secondsLeft) {
      const timerEl = document.getElementById('main-reg-timer');
      let remaining = secondsLeft;

      function update() {
        if (remaining <= 0) {
          clearInterval(mainRegTimerInterval);
          timerEl.textContent = '🔒 Регистрация закрыта';
          return;
        }
        const days = Math.floor(remaining / 86400);
        const hours = Math.floor((remaining % 86400) / 3600);
        const minutes = Math.floor((remaining % 3600) / 60);

        let text = '⏰ До конца регистрации: ';
        if (days > 0) text += days + ' д ' + hours + ' ч';
        else if (hours > 0) text += hours + ' ч ' + minutes + ' мин';
        else text += minutes + ' мин';

        timerEl.textContent = text;
        remaining -= 60;
      }
      update();
      mainRegTimerInterval = setInterval(update, 60000);
    }

        html += '<button class="btn btn-green" style="margin-top:14px;" onclick="confirmReceived()">🎁 Я получил(а) подарок</button>';

        if (assignedData.wishes) aHtml += '<div class="info"><b>Пожелания:</b> ' + linkify(assignedData.wishes) + '</div>';
        if (assignedData.ozon_address) aHtml += '<div class="address"><b>Озон:</b> ' + assignedData.ozon_address + '</div>';
        if (assignedData.wb_address) aHtml += '<div class="address"><b>WB:</b> ' + assignedData.wb_address + '</div>';

        const recipientStatus = assignedData.gift_status || 'not_seen';
        aHtml += '<div style="margin-top:10px; font-size:13px; opacity:0.9;">Статус подарка для подопечного: <b>' + (STATUS_LABELS[recipientStatus] ? STATUS_LABELS[recipientStatus].label : recipientStatus) + '</b></div>';

        aHtml += '<div style="margin-top:16px;">';

        if (recipientStatus === 'bought' || recipientStatus === 'shipping') aHtml += '<button class="btn-status" onclick="setStatus(\'shipping\')" style="background: #E67E22;">🟠 Подарок в пути</button><br>';

        aHtml += '</div></div>';

      }
    }

        async function setStatus(newStatus) {
      if (!currentUser || !assignedData || !assignedData.telegram_id) {
        showToast('Не удалось определить подопечного');
        return;
      }

      try {
        const result = await api('update-gift-status', {
          telegram_id: currentUser.id,
          target_id: assignedData.telegram_id,
          new_status: newStatus
        });

        if (!result || result.error || !result.success) {
          showToast('Ошибка: ' + (result && result.error ? result.error : 'Не удалось обновить статус'));
          return;
        }

        showToast('✅ Статус подарка подопечного обновлён');
        setTimeout(function() { location.reload(); }, 600);
      } catch (err) {
        console.error('Ошибка setStatus:', err);
        showToast('Не удалось связаться с сервером');
      }
    }

    // Получатель подтверждает получение подарка.
    // API обновляет gift_status самого текущего пользователя.
    async function confirmReceived() {
      if (!currentUser) {
        showToast('Не удалось определить пользователя');
        return;
      }

      try {
        const result = await api('update-gift-status', {
          telegram_id: currentUser.id,
          new_status: 'received'
        });

        if (!result || result.error || !result.success) {
          showToast('Ошибка: ' + (result && result.error ? result.error : 'Не удалось подтвердить получение'));
          return;
        }

        showToast('🎉 Получение подарка подтверждено!');
        setTimeout(function() { location.reload(); }, 600);
      } catch (err) {
        console.error('Ошибка confirmReceived:', err);
        showToast('Не удалось связаться с сервером');
      }
    }

    async function loadAdminList() {
      const list = document.getElementById('admin-all-list');
      list.innerHTML = 'Загрузка...';
      const result = await api('get-all-santas', { admin_id: currentUser.id });
      if (result.error) { list.innerHTML = '<div style="color:#E74C3C;">Ошибка: ' + result.error + '</div>'; return; }

      const titleEl = document.getElementById('admin-participants-title');
      if (titleEl) {
        titleEl.textContent = '👥 Все участники (' + result.santas.length + ')';
      }

      let html = '';
      result.santas.forEach(function(s) {
        const sLabel = STATUS_LABELS[s.gift_status] ? STATUS_LABELS[s.gift_status].label : (s.gift_status || 'not_seen');

        html += '<div class="admin-row">';

        // Ник и роль
        let roleIcon = '';
        if (s.is_observer) roleIcon = ' 👁️ (наблюдатель)';
        else if (s.is_admin) roleIcon = ' 👑 (админ)';

        html += '<div class="nick">' + s.nickname + roleIcon + '</div>';

        // Кому попался
        html += '<div class="assign">' + (s.assigned_nickname ? '🎁 Дарит: <b>' + s.assigned_nickname + '</b>' : '🎁 Дарит: (не назначен)') + '</div>';

        // Статус подарка
        html += '<div class="assign">Статус: ' + sLabel + '</div>';

        // Пожелания
        if (s.wishes) {
          html += '<div class="assign" style="background: rgba(255,255,255,0.6); padding: 6px; border-radius: 6px; margin-top: 4px;">💭 <i>' + s.wishes + '</i></div>';
        } else {
          html += '<div class="assign" style="color: #BDC3C7;">💭 (пожеланий нет)</div>';
        }

        // Кнопки управления
        html += '<div style="margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap;">';

        // Кнопки для обычного игрока
        if (!s.is_admin && !s.is_observer) {
          html += '<button class="admin-promote-btn" onclick="makeAdmin(' + s.telegram_id + ', \'' + s.nickname + '\')">👑 Сделать админом</button>';
          html += '<button class="admin-promote-btn" style="background: #E74C3C;" onclick="removeParticipant(' + s.telegram_id + ', \'' + s.nickname + '\')">🗑️ Удалить</button>';
        }

        // Снять админку
        if (s.is_admin && !s.is_observer && s.telegram_id !== currentUser.id) {
          html += '<button class="admin-promote-btn" style="background: #95A5A6;" onclick="removeAdmin(' + s.telegram_id + ', \'' + s.nickname + '\')">⬇️ Снять админку</button>';
        }

        html += '</div></div>';
      });
      list.innerHTML = html;
    }

    window.makeAdmin = async function(telegramId, nickname) {
      if (!confirm('Сделать ' + nickname + ' админом?')) return;
      try {
        const res = await fetch('/api/make-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            admin_id: currentUser.id,
            target_id: telegramId
          })
        });
        const data = await res.json();
        if (data.error) { showToast('Ошибка: ' + data.error); return; }
        showToast('✅ ' + nickname + ' теперь админ!');
        setTimeout(function() { loadAdminList(); }, 500);
      } catch (e) {
        showToast('Ошибка: ' + e.message);
      }
    };

    window.removeAdmin = async function(telegramId, nickname) {
      if (!confirm('Снять админку с ' + nickname + '? Он станет обычным игроком.')) return;

      try {
        const res = await fetch('/api/remove-admin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            admin_id: currentUser.id,
            target_id: telegramId
          })
        });
        const data = await res.json();

        if (data.error) { 
          showToast('Ошибка: ' + data.error); 
          return; 
        }

        showToast('✅ ' + nickname + ' больше не админ');
        setTimeout(function() { loadAdminList(); }, 500);
      } catch (e) {
        showToast('Ошибка: ' + e.message);
      }
    };

    window.removeParticipant = async function(telegramId, nickname) {
      if (!confirm('Удалить участника ' + nickname + ' из игры? Это действие необратимо.')) return;
      try {
        const res = await fetch('/api/remove-participant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_id: currentUser.id, target_id: telegramId })
        });
        const data = await res.json();
        if (data.error) { showToast('Ошибка: ' + data.error); return; }
        showToast('✅ ' + data.nickname + ' удалён из игры');
        setTimeout(function() { loadAdminList(); }, 500);
      } catch (e) {
        showToast('Ошибка: ' + e.message);
      }
    };

    async function doDistribute() {
      if (!confirm('Распределить всех Санта-Морозов? После этого изменить нельзя.')) return;
      const result = await api('distribute', { admin_id: currentUser.id });
      if (result.error) { showToast('Ошибка: ' + result.error); return; }
      showToast('✅ Распределено!');
      setTimeout(function() { location.reload(); }, 800);
    }

    async function doReset() {
      if (!confirm('⚠️ Сбросить ВСЁ? Удалятся все участники и данные.')) return;
      if (!confirm('Точно? Это необратимо!')) return;
      const result = await api('reset-game', { admin_id: currentUser.id });
      if (result.error) { showToast('Ошибка: ' + result.error); return; }
      showToast('✅ Всё сброшено');
      setTimeout(function() { location.reload(); }, 800);
    }
  </script>
</body>
</html>
